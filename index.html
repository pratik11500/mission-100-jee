<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission 100 · JEE 2027 Tracker</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236d4aff'/%3E%3Cstop offset='1' stop-color='%23a259ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='36' height='36' rx='11' fill='url(%23g)'/%3E%3Cg transform='translate(6 6) scale(1.0)'%3E%3Cpath fill='%23fff' d='M12 2.5c.6 3.2-1.2 4.9-2.7 6.6C7.7 10.9 6.5 12.6 6.5 15a5.5 5.5 0 0 0 11 0c0-2.1-.9-3.6-2-4.9-.3 1.2-1 2-1.9 2.3.5-3.4-.4-7.4-1.6-9.9z'/%3E%3C/g%3E%3C/svg%3E">
<meta name="theme-color" content="#6d4aff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3fb;--card:#fff;--tx:#1d1b2e;--mu:#7a7894;--bd:#e6e4f2;--ac:#6d4aff;--ac2:#a259ff;--ok:#16b87a;--in:#f0eefb;--sh:0 8px 30px rgba(80,60,160,.08);--sk1:#ebe9f6;--sk2:#f6f5fc}
:root[data-theme=dark]{--bg:#0d0c16;--card:#171526;--tx:#ece9fb;--mu:#8d89ad;--bd:#272440;--ac:#8b6cff;--ac2:#c07bff;--ok:#2fd69a;--in:#1f1c33;--sh:0 8px 30px rgba(0,0,0,.4);--sk1:#1f1c33;--sk2:#2a2646}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);transition:background .3s,color .3s}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(600px 300px at 10% -5%,rgba(109,74,255,.18),transparent),radial-gradient(500px 300px at 95% 0,rgba(162,89,255,.14),transparent);pointer-events:none;z-index:-1}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:20;backdrop-filter:blur(16px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--bd)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px;letter-spacing:-.3px}
.logo svg{width:20px;height:20px;fill:#fff}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800;box-shadow:0 6px 16px rgba(109,74,255,.35)}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--mu);letter-spacing:0}
.ctl{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);height:38px;padding:0 14px;border-radius:999px;font:600 13px Inter,sans-serif;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.2s;box-shadow:var(--sh)}
.btn:hover{transform:translateY(-1px)}
.btn.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mu)}.btn.on .dot{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.ic{width:38px;padding:0;justify-content:center}.ic svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav{display:flex;gap:6px;padding:0 0 12px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1;min-width:max-content;border:0;background:transparent;color:var(--mu);font:600 14px Inter,sans-serif;padding:10px 18px;border-radius:999px;cursor:pointer;transition:.2s}
nav button.act{background:var(--card);color:var(--ac);box-shadow:var(--sh)}
nav .short{display:none}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:22px 0 16px;flex-wrap:wrap}
.hero h1{font-size:28px;letter-spacing:-.8px;font-weight:800}
.hero p{color:var(--mu);font-size:13px;margin-top:4px}
.pg{min-width:220px;flex:0 1 320px}
.pg .l{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--mu);margin-bottom:7px}
.bar{height:10px;border-radius:99px;background:var(--in);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .5s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;box-shadow:var(--sh);padding:8px;margin-bottom:40px}
.row{display:grid;grid-template-columns:minmax(0,2.4fr) repeat(var(--c),minmax(64px,.7fr)) minmax(0,1.6fr);gap:10px;align-items:center;padding:10px 14px;border-radius:16px;transition:background .2s}
.row:not(.hd):hover{background:var(--in)}
.row.hd{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--mu);padding-top:14px}
.row.hd span:not(:first-child){text-align:center}
.nm{display:flex;align-items:center;gap:12px;font-size:14px;font-weight:600;min-width:0}
.nm .n{flex:none;width:28px;height:28px;border-radius:10px;background:var(--in);color:var(--ac);font-size:12px;font-weight:700;display:grid;place-items:center}
.nm em{display:block;font-style:normal;font-size:11px;color:var(--mu);font-weight:500;margin-top:2px}
.cell{display:flex;flex-direction:column;align-items:center;gap:5px}
.lb{display:none;font-size:10px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.5px}
.chk{width:30px;height:30px;border-radius:10px;border:2px solid var(--bd);background:var(--in);cursor:pointer;display:grid;place-items:center;color:transparent;transition:.2s;padding:0}
.chk svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.chk.on{background:linear-gradient(135deg,var(--ok),#2fe0a8);border-color:transparent;color:#fff;box-shadow:0 5px 14px rgba(22,184,122,.35);transform:scale(1.04)}
body:not(.edit) .chk,body:not(.edit) .inp{cursor:default}
.inp{width:100%;height:36px;border-radius:12px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:500 13px Inter,sans-serif;padding:0 12px;outline:0;transition:.2s}
body.edit .inp:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(109,74,255,.15)}
.inp::placeholder{color:var(--mu);opacity:.6}
.sfx{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--mu);font-weight:600}.sfx .inp{text-align:center;padding:0 4px}
.sk{border-radius:12px;background:linear-gradient(90deg,var(--sk1),var(--sk2),var(--sk1));background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;background:var(--tx);color:var(--bg);padding:11px 20px;border-radius:999px;font-size:13px;font-weight:600;transition:.3s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sync{font-size:11px;color:var(--mu);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}.sync.err i{background:#ff4d6d}

/* password modal */
.mod{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;background:rgba(8,6,20,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s}
.mod.show{opacity:1;pointer-events:auto}
.mbox{text-align:center;width:100%;max-width:360px;background:var(--card);border:1px solid var(--bd);border-radius:24px;box-shadow:0 20px 60px rgba(0,0,0,.35);padding:24px 22px 20px;transform:translateY(14px) scale(.97);transition:transform .25s}
.mod.show .mbox{transform:none}
.mbox.shake{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.mic{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;margin:0 auto 14px;box-shadow:0 8px 20px rgba(109,74,255,.35)}
.mic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mbox h2{font-size:19px;font-weight:800;letter-spacing:-.4px}
.mbox p{font-size:13px;color:var(--mu);margin:4px 0 16px}
.pw{position:relative}
.pw input{text-align:left;width:100%;height:46px;border-radius:14px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:500 16px Inter,sans-serif;padding:0 46px 0 14px;outline:0;transition:.2s}
.pw input:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(109,74,255,.18)}
.pw.bad input{border-color:#ff4d6d;box-shadow:0 0 0 3px rgba(255,77,109,.15)}
.eye{position:absolute;right:4px;top:4px;width:38px;height:38px;border:0;background:transparent;color:var(--mu);border-radius:10px;cursor:pointer;display:grid;place-items:center}
.eye svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.merr{font-size:12px;font-weight:600;color:#ff4d6d;min-height:16px;margin-top:8px}
.macts{display:flex;gap:10px;margin-top:10px}
.macts button{flex:1;height:44px;border-radius:14px;font:700 14px Inter,sans-serif;cursor:pointer;border:1px solid var(--bd);background:var(--in);color:var(--tx);transition:.2s}
.macts button.go{border:0;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 16px rgba(109,74,255,.35)}
.macts button:disabled{opacity:.6;cursor:wait}
@media(max-width:760px){
 .wrap{padding:0 12px}.hero h1{font-size:23px}.pg{flex:1 1 100%}
 .brand small,.btn span.t{display:none}.btn{padding:0 12px}
 nav{overflow:visible;gap:4px}
 nav button{min-width:0;padding:10px 4px;font-size:13px;text-align:center}
 nav .full{display:none}nav .short{display:inline}
 .card{padding:8px;border-radius:22px}
 .row.hd{display:none}
 .row{grid-template-columns:repeat(var(--c),1fr);border:1px solid var(--bd);margin:8px 0;padding:14px;border-radius:20px;gap:12px 8px;background:var(--card)}
 .row .nm,.row .rm{grid-column:1/-1}
 .lb{display:block}
 .chk{width:38px;height:38px;border-radius:13px}
}
</style>
</head>
<body>
<header><div class="wrap">
 <div class="top">
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24"><path d="M12 2.5c.6 3.2-1.2 4.9-2.7 6.6C7.7 10.9 6.5 12.6 6.5 15a5.5 5.5 0 0 0 11 0c0-2.1-.9-3.6-2-4.9-.3 1.2-1 2-1.9 2.3.5-3.4-.4-7.4-1.6-9.9z"/></svg></div><div>Mission 100<small>JEE 2027 · Progress Tracker</small></div></div>
  <div class="ctl">
   <div class="sync" id="sync"><i></i><span class="t">Synced</span></div>
   <button class="btn" id="editBtn"><span class="dot"></span><span class="t">Edit</span> <b id="editSt">OFF</b></button>
   <button class="btn ic" id="themeBtn" aria-label="Theme"></button>
  </div>
 </div>
 <nav id="tabs"></nav>
</div></header>
<div class="wrap"><div class="hero"><div><h1 id="ttl"></h1><p>Mission 100 JEE 2027 • Personal Progress Tracker</p></div><div class="pg" id="pg"></div></div>
<div class="card" id="app"></div></div>
<div class="toast" id="toast"></div>
<div class="mod" id="mod" aria-hidden="true"><div class="mbox" id="mbox" role="dialog" aria-modal="true" aria-labelledby="mt">
 <div class="mic"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
 <h2 id="mt">Enter edit password</h2><p>Only you can change progress. Viewing stays open for everyone.</p>
 <div class="pw" id="pw"><input id="pwIn" type="password" placeholder="Password" autocomplete="current-password" autocapitalize="off" spellcheck="false"><button class="eye" id="eye" type="button" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
 <div class="merr" id="merr"></div>
 <div class="macts"><button type="button" id="mCancel">Cancel</button><button type="button" class="go" id="mGo">Unlock</button></div>
</div></div>

<script>
const API='/api/tracker';
const SUB={
physics:{name:'Physics',list:'Units, Dimensions & Measurements|Mathematical Tools & Vectors|Motion in a Straight Line|Motion in a Plane|Laws of Motion|Work, Energy & Power|Centre of Mass & System of Particles|Rotational Motion|Rotational Motion & Rotational Dynamics|Mechanical Properties of Solids|Thermal Properties of Matter|Kinetic Theory of Thermodynamics|Mechanical Properties of Fluids|Oscillations|Waves|Electric Charges & Fields|Electrostatic Potential & Capacitance|Current Electricity|Moving Charges & Magnetism|Magnetism & Matter|Electromagnetic Induction|Alternating Current|Electromagnetic Waves|Ray Optics & Optical Instruments|Wave Optics|Dual Nature of Radiation & Matter|Atoms|Nuclei|Semiconductor Electronics: Materials, Devices & Simple Circuits'},
chemistry:{name:'Chemistry',list:'Some Basic Concepts of Chemistry|Structure of Atom|Thermodynamics & Thermochemistry|Equilibrium|Electrochemistry|Chemical Kinetics|Surface Chemistry|Redox Reaction|Solutions|Coordination Compounds|Principles of Qualitative Analysis|p-Block Elements|The d- and f-Block Elements|Some Basic Principles & Techniques (IUPAC Naming)|Isomerism|Hydrocarbons|Haloalkanes & Haloarenes|Alcohols, Phenols & Ethers|Aldehydes, Ketones & Carboxylic Acids|Amines|Biomolecules|Purification Methods'},
maths:{name:'Mathematics',list:'Sequence & Series|Quadratic Equations|Complex Numbers|Binomial Theorem|Straight Lines|Circles|Conic Sections: Parabola|Conic Sections: Hyperbola|Conic Sections: Ellipse|Complex Number|Statistics|Trigonometric Functions|Trigonometric Equation|Solutions of Triangle|Determinants|Matrices|Vector Algebra|Three Dimensional Geometry|Sets & Relations|Functions|Inverse Trigonometric Functions|Limits, Continuity & Differentiability|Method of Differentiation|Application of Derivatives|Indefinite Integration|Application of Integrals|Differential Equation|Probability'}
};
Object.values(SUB).forEach(s=>s.list=s.list.split('|'));
const dates='11 Oct 2026,18 Oct 2026,25 Oct 2026,1 Nov 2026,22 Nov 2026,29 Nov 2026,6 Dec 2026,13 Dec 2026,20 Dec 2026,27 Dec 2026,3 Jan 2027,10 Jan 2027,13 Jan 2027,15 Jan 2027,20 Jan 2027,24 Jan 2027,31 Jan 2027,7 Feb 2027,14 Feb 2027,21 Feb 2027,28 Feb 2027,7 Mar 2027,14 Mar 2027,21 Mar 2027,28 Mar 2027,4 Apr 2027,11 Apr 2027,18 Apr 2027,25 Apr 2027,2 May 2027,9 May 2027,12 May 2027'.split(',');
const TESTS=dates.map((d,i)=>({name:i<12?`JEE Mains-${i+1}`:`AITS-${i-11}`,date:d,pat:i<12?'JEE Mains':i<26?'Main':i<29?'JEE Main':'JEE Advanced'}));
const FIELDS=[['l','Lecture'],['d','DPP'],['p','PYQ'],['t','Test']];
const CHK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const $=s=>document.querySelector(s);
let S={},tab='physics',loading=true,edit=false,key=localStorage.getItem('ek')||'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* theme */
const SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
function theme(t){document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);$('#themeBtn').innerHTML=t==='dark'?SUN:MOON}
theme(localStorage.getItem('theme')||'dark');
$('#themeBtn').onclick=()=>theme(document.documentElement.dataset.theme==='dark'?'light':'dark');

/* edit mode */
function setEdit(v){edit=v;document.body.classList.toggle('edit',v);$('#editBtn').classList.toggle('on',v);$('#editSt').textContent=v?'ON':'OFF';document.querySelectorAll('.inp').forEach(i=>i.readOnly=!v)}
/* password modal */
let pwBusy=false,pwResolve=null;
function askPass(){
 return new Promise(res=>{
  pwResolve=res;$('#pwIn').value='';$('#pwIn').type='password';$('#merr').textContent='';$('#pw').classList.remove('bad');
  $('#mod').classList.add('show');$('#mod').setAttribute('aria-hidden','false');
  setTimeout(()=>$('#pwIn').focus(),120);
 });
}
function closePass(v){$('#mod').classList.remove('show');$('#mod').setAttribute('aria-hidden','true');$('#pwIn').blur();if(pwResolve){pwResolve(v);pwResolve=null}}
async function verifyPass(k){
 const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-edit-key':k},body:JSON.stringify({verify:true})});
 return r.ok;
}
async function submitPass(){
 if(pwBusy)return;const k=$('#pwIn').value;
 if(!k){$('#pwIn').focus();return}
 pwBusy=true;$('#mGo').disabled=true;$('#mGo').textContent='Checking…';$('#merr').textContent='';$('#pw').classList.remove('bad');
 let ok=false,net=false;
 try{ok=await verifyPass(k)}catch{net=true}
 pwBusy=false;$('#mGo').disabled=false;$('#mGo').textContent='Unlock';
 if(ok)return closePass(k);
 $('#merr').textContent=net?'Network error, try again':'Wrong password';
 $('#pw').classList.add('bad');
 const b=$('#mbox');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');
 $('#pwIn').select();
}
$('#mGo').onclick=submitPass;
$('#mCancel').onclick=()=>closePass(null);
$('#mod').addEventListener('click',e=>{if(e.target.id==='mod')closePass(null)});
$('#pwIn').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitPass()}});
$('#pwIn').addEventListener('input',()=>{$('#pw').classList.remove('bad');$('#merr').textContent=''});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#mod').classList.contains('show'))closePass(null)});
$('#eye').onclick=()=>{const i=$('#pwIn');i.type=i.type==='password'?'text':'password';i.focus()};

/* edit mode */
$('#editBtn').onclick=async()=>{
 if(edit){setEdit(false);localStorage.removeItem('ek');key='';return toast('Edit mode off · view only')}
 const k=await askPass();if(!k)return;
 key=k;localStorage.setItem('ek',k);setEdit(true);toast('Edit mode on')
};

/* ui helpers */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
function syncUI(ok,txt){const s=$('#sync');s.classList.toggle('err',!ok);s.querySelector('span').textContent=txt}

/* tabs */
const SHORT={physics:'Phy',chemistry:'Chem',maths:'Math',tests:'Test'};
$('#tabs').innerHTML=[...Object.entries(SUB).map(([k,v])=>[k,v.name]),['tests','Test Tracker']].map(([k,n])=>`<button data-t="${k}"><span class="full">${n}</span><span class="short">${SHORT[k]}</span></button>`).join('');
$('#tabs').onclick=e=>{const b=e.target.closest('button');if(b){tab=b.dataset.t;history.replaceState(null,'','#'+tab);render();scrollTo({top:0,behavior:'smooth'})}};

/* render */
function skel(n=10){return Array.from({length:n},()=>'<div class="row"><div class="sk" style="height:34px;grid-column:1/-1"></div></div>').join('')}
function chk(k,lab){return `<div class="cell"><button class="chk ${S[k]?'on':''}" data-k="${k}" aria-label="${lab}">${CHK}</button><span class="lb">${lab}</span></div>`}
function inp(k,ph,cls=''){return `<input class="inp ${cls}" data-k="${k}" value="${esc(S[k])}" placeholder="${ph}" ${edit?'':'readonly'} maxlength="200" autocomplete="off">`}
function progress(){
 let tot,done=0;
 if(tab==='tests'){tot=TESTS.length;TESTS.forEach((_,i)=>S[`tests:${i}:a`]&&done++)}
 else{const n=SUB[tab].list.length;tot=n*4;for(let i=0;i<n;i++)FIELDS.forEach(f=>S[`${tab}:${i}:${f[0]}`]&&done++)}
 const p=Math.round(done/tot*100);
 $('#pg').innerHTML=loading?'<div class="sk" style="height:34px"></div>':`<div class="l"><span>${tab==='tests'?'Tests attempted':'Completion'}</span><span>${done}/${tot} · ${p}%</span></div><div class="bar"><i style="width:${p}%"></i></div>`;
}
function render(){
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('act',b.dataset.t===tab));
 $('#ttl').textContent=tab==='tests'?'Test Tracker':SUB[tab].name+' Tracker';
 progress();
 if(loading){$('#app').innerHTML=skel();return}
 let h;
 if(tab==='tests'){
  h=`<div class="row hd" style="--c:3"><span>Test</span><span>Attempted</span><span>Score</span><span>Accuracy</span><span>Mistakes / Topics</span></div>`+
  TESTS.map((t,i)=>`<div class="row" style="--c:3"><div class="nm"><span class="n">${i+1}</span><div>${t.name}<em>${t.date} · ${t.pat}</em></div></div>
   ${chk(`tests:${i}:a`,'Attempted')}
   <div class="cell"><div class="sfx">${inp(`tests:${i}:s`,'—','num')}/300</div><span class="lb">Score</span></div>
   <div class="cell"><div class="sfx">${inp(`tests:${i}:c`,'—','num')}%</div><span class="lb">Accuracy</span></div>
   <div class="rm">${inp(`tests:${i}:r`,'Mistakes / topics')}</div></div>`).join('');
 }else{
  h=`<div class="row hd" style="--c:4"><span>Chapter / Topic</span>${FIELDS.map(f=>`<span>${f[1]}</span>`).join('')}<span>Status / Remarks</span></div>`+
  SUB[tab].list.map((c,i)=>`<div class="row" style="--c:4"><div class="nm"><span class="n">${i+1}</span><div>${esc(c)}</div></div>${FIELDS.map(f=>chk(`${tab}:${i}:${f[0]}`,f[1])).join('')}<div class="rm">${inp(`${tab}:${i}:r`,'Status / remarks')}</div></div>`).join('');
 }
 $('#app').innerHTML=h;
}

/* save */
async function save(k,v){
 const old=S[k];if(v)S[k]=v;else delete S[k];
 syncUI(true,'Saving…');
 try{
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','x-edit-key':key},body:JSON.stringify({k,v})});
  if(r.status===401){setEdit(false);throw new Error('Session expired, re-enter password')}
  if(!r.ok)throw new Error('Save failed');
  syncUI(true,'Synced');
 }catch(e){
  if(old)S[k]=old;else delete S[k];render();syncUI(false,'Error');toast(e.message||'Save failed')
 }
}
$('#app').addEventListener('click',e=>{
 const b=e.target.closest('.chk');if(!b)return;
 if(!edit)return toast('View only · turn on Edit mode');
 const k=b.dataset.k,on=!S[k];b.classList.toggle('on',on);save(k,on?'1':'');progress();
});
$('#app').addEventListener('change',e=>{
 const i=e.target.closest('.inp');if(!i||!edit)return;
 save(i.dataset.k,i.value.trim());
});

/* load */
async function load(first){
 if(first){loading=true;render()}
 try{
  const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw 0;
  S=await r.json();syncUI(true,'Synced');
 }catch{syncUI(false,'Offline');toast('Could not load data')}
 loading=false;render();
}
const h=location.hash.slice(1);if(h==='tests'||SUB[h])tab=h;
if(localStorage.getItem('ek'))setEdit(true);
load(true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!document.activeElement?.classList?.contains('inp'))load(false)});
</script>
</body>
</html>
